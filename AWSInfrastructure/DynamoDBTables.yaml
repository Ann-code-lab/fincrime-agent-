#DynamoDb Table 1
Resources:
 CustomerTable:
  Type: AWS::DynamoDB::Table
  Properties:
   TableName: FinCrime-Customers
   BillingMode: PAY_PER_REQUEST

   AttributeDefinitions:
    - AttributeName: CustomerId
      AttributeType: S

  
   KeySchema:
    - AttributeName: CustomerId 
      KeyType: HASH

   SSESpecification:
    SSEEnabled: true

#DynamoDb Table 2
 TransactionTable:
  Type: AWS::DynamoDB::Table 
  Properties:
   TableName: FinCrime-Transactions
   BillingMode: PAY_PER_REQUEST

   AttributeDefinitions:
    - AttributeName: TransactionId
      AttributeType: S

   KeySchema:
    - AttributeName: TransactionId
      KeyType: HASH

   SSESpecification:
    SSEEnabled: true

##DynamoDB Table 3:
 TransactionHistoryTable:
  Type: AWS::DynamoDB::Table
  Properties:
   TableName: FinCrime-TransactionHistoryTable
   BillingMode: PAY_PER_REQUEST

   AttributeDefinitions:
    - AttributeName: CustomerId
      AttributeType: S
       
    - AttributeName: TransactionTimeStamp 
      AttributeType: S

   KeySchema:
    - AttributeName: CustomerId 
      KeyType: HASH

    - AttributeName: TransactionTimeStamp
      KeyType: RANGE

   SSESpecification:
    SSEEnabled: true
